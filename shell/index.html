<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One EAD — Electroacoustic Engineering Suite</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" href="favicon.ico" />
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <div class="portal" id="portal">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <button class="brand-button" id="brand-home-btn" type="button" title="Back to All Plugins summary" aria-label="One EAD — Back to summary page">
          <div class="brand-mark">
            <span class="brand-pulse"></span>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 15v-6M9 18v-12M14 20v-16M19 15v-6" />
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-title">One EAD</span>
            <span class="brand-sub">Electroacoustic Suite</span>
          </div>
        </button>
        <button class="sidebar-collapse" id="collapse-btn" title="Collapse sidebar" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
      </div>

      <div class="sidebar-search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" />
        </svg>
        <input type="text" id="module-search" placeholder="Search plugins…" autocomplete="off" />
      </div>

      <nav class="module-list" id="module-list" aria-label="Plugins"></nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <span>Theme</span>
        </button>
        <span class="version" id="module-count"></span>
      </div>
    </aside>

    <!-- Main area -->
    <main class="stage">
      <header class="stage-header">
        <div class="stage-title">
          <span class="stage-accent-dot" id="stage-dot"></span>
          <div>
            <h1 id="stage-title">Welcome</h1>
            <p id="stage-subtitle">Select a plugin from the sidebar to begin.</p>
          </div>
        </div>
        <div class="stage-actions">
          <button class="ghost-btn" id="fullscreen-btn" title="Toggle Full Screen (or press F11)" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3" />
            </svg>
            <span>Full Screen</span>
          </button>
          <button class="ghost-btn" id="reload-btn" title="Reload current plugin" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 4v6h-6" /><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
            </svg>
            <span>Reload</span>
          </button>
          <button class="ghost-btn" id="open-new-btn" title="Open in a new browser tab" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><path d="M15 3h6v6" /><path d="M10 14L21 3" />
            </svg>
          </button>
        </div>
      </header>

      <div class="stage-body" id="stage-body">
        <!-- Landing view -->
        <section class="landing" id="landing">
          <div class="tool-grid" id="tool-grid"></div>
        </section>

        <!-- Module host -->
        <div class="frame-host" id="frame-host" hidden>
          <div class="frame-loader" id="frame-loader"><div class="spinner"></div></div>
        </div>
      </div>
    </main>
  </div>

  <script src="portal.js"></script>
</body>
</html>
