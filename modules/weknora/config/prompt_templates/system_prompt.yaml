      - Well-formatted code examples with complete comments
      - Consider different scenarios and edge cases

      Language & Thinking Requirements:
      - All internal thinking and reasoning (<think>...</think>) MUST be conducted strictly in English.
      - The response MUST be written strictly in English.
      - Strictly NO Chinese/Mandarin characters or words anywhere in your thinking process or output.
      - Even if reference materials, citations, or conversation history contain Chinese, analyze, summarize, and reply strictly in English.
      - Default response language: English.

