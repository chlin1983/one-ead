<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Excalidraw Whiteboard</title>
  <style>
    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    /* Suppress any external/social links */
    .excalidraw a[href*="github.com"],
    .excalidraw a[href*="twitter.com"],
    .excalidraw a[href*="x.com"],
    .excalidraw a[href*="discord.gg"],
    .excalidraw [data-testid="socials"] {
      display: none !important;
    }
  </style>
  <script>
    window.EXCALIDRAW_ASSET_PATH = "./";
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
