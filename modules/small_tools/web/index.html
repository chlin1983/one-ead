<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Small Tools</title>
  <link rel="stylesheet" href="/shared/module.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="module-root">
    <section id="view-grid" class="view">
      <header class="page-head">
        <h1>Small Tools</h1>
        <p>Handy utilities, one click away. Pick a card to open the tool.</p>
      </header>
      <div id="grid" class="grid"></div>
    </section>

    <section id="view-tool" class="view tool-view" hidden>
      <div class="toolbar">
        <button class="btn" id="btn-back" type="button">&larr; All tools</button>
        <strong id="tool-title"></strong>
        <span class="spacer"></span>
        <button class="btn ghost" id="btn-open-tab" type="button" title="Open in new browser tab">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          Open in tab
        </button>
        <button class="btn" id="btn-toggle-panel" type="button" title="Toggle previous working files panel">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          Drawings (<span id="panel-file-count">1</span>)
        </button>
      </div>
      <div class="tool-stage">
        <div class="stage-container">
          <div class="stage-main">
            <iframe id="tool-frame" title="Tool" hidden></iframe>
            <div id="tool-overlay" class="tool-overlay">
              <div id="tool-spinner" class="spinner"></div>
              <div id="tool-overlay-text">Starting&hellip;</div>
              <button class="btn primary" id="btn-reopen" type="button" hidden>Reopen</button>
            </div>
          </div>
          <aside id="working-files-panel" class="drawings-panel" hidden>
            <div class="panel-header">
              <div class="panel-title-wrap">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                <h3>Saved Drawings</h3>
              </div>
              <button class="btn ghost icon-btn" id="btn-close-panel" title="Close panel">&times;</button>
            </div>
            <div class="panel-actions-bar">
              <input type="text" id="panel-search-input" class="search-input" placeholder="Search drawings..." />
              <button class="btn primary btn-sm" id="panel-new-board-btn" title="Create new blank whiteboard">+ New</button>
            </div>
            <div id="files-list" class="drawings-list">
              <!-- Dynamically populated files list -->
            </div>
            <div class="panel-footer">
              <span class="disk-status-label">💾 Saved to disk (drawings/)</span>
            </div>
          </aside>
        </div>
      </div>
    </section>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
