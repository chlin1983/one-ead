<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chili3D</title>
  <link rel="stylesheet" href="/shared/module.css" />
  <link rel="stylesheet" href="wrapper.css" />
</head>
<body>
  <div class="c3d-root">
    <button class="bar-handle" id="bar-handle" type="button" title="Show toolbar" aria-label="Show toolbar"></button>
    <header class="c3d-bar">
      <div class="bar-left">
        <strong class="bar-title">Chili3D</strong>
        <span class="chip" id="chip-version" title="Installed version">not installed</span>
        <button class="btn" id="btn-home" type="button" title="Leave the working page and go to the Chili3D start page" hidden>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
          <span>Home</span>
        </button>
        <span class="chip warn" id="chip-update" hidden></span>
      </div>

      <div class="bar-center">
        <span class="sync" id="sync" data-state="idle" title="Works are mirrored to disk automatically">
          <span class="dot"></span><span id="sync-text">Disk backup: starting</span>
        </span>
      </div>

      <div class="bar-right">
        <button class="btn primary" id="btn-update" type="button" hidden>Update</button>
        <button class="btn primary" id="btn-reload" type="button" hidden>Reload to use new version</button>
        <button class="btn" id="btn-fullscreen" type="button" title="Hide the browser and portal chrome (Hold Esc or click to exit)">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          <span id="fs-label">Work in Full Screen</span>
        </button>
        <div class="menu-wrap">
          <button class="btn icon" id="btn-settings" type="button" title="Updates &amp; settings" aria-label="Updates and settings" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="2" fill="var(--surface)"/><circle cx="15" cy="12" r="2" fill="var(--surface)"/><circle cx="8" cy="18" r="2" fill="var(--surface)"/></svg>
          </button>
          <div class="menu" id="menu" role="menu" hidden>
            <label class="menu-row" title="Which upstream build to track">
              <span>Channel</span>
              <select id="sel-channel">
                <option value="release">Latest release</option>
                <option value="main">Latest main</option>
              </select>
            </label>
            <label class="menu-row check" title="Save changes to your projects automatically a moment after you stop editing">
              <input type="checkbox" id="chk-autosave" /> <span>Autosave projects</span>
            </label>
            <label class="menu-row check" title="Build newer upstream versions automatically when available">
              <input type="checkbox" id="chk-auto" /> <span>Auto-update</span>
            </label>
            <button class="menu-item" id="btn-check" type="button">Check for updates</button>
            <a class="menu-item" href="https://github.com/xiangechen/chili3d" target="_blank" rel="noopener noreferrer"
               title="Chili3D is open source under AGPL-3.0. Opens the upstream source and license.">Source / License (AGPL-3.0)</a>
          </div>
        </div>
      </div>
    </header>

    <main class="c3d-stage">
      <iframe id="app-frame" title="Chili3D" hidden allow="clipboard-read; clipboard-write; fullscreen; keyboard-map"></iframe>

      <section class="installer" id="installer" hidden>
        <div class="card installer-card">
          <h2 id="inst-title">Setting up Chili3D</h2>
          <p class="muted" id="inst-msg">Preparing…</p>
          <div class="bar-track" id="inst-track"><div class="bar-fill"></div></div>
          <pre class="log" id="inst-log"></pre>
          <div class="inst-actions">
            <button class="btn primary" id="btn-retry" type="button" hidden>Retry</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="wrapper.js"></script>
</body>
</html>
