<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepTutor</title>
  <link rel="stylesheet" href="/shared/module.css" />
  <link rel="stylesheet" href="wrapper.css" />
</head>
<body>
  <div class="dt-root">
    <header class="dt-bar">
      <div class="bar-left">
        <strong class="bar-title">DeepTutor</strong>
        <span class="chip" id="chip-version" title="Installed upstream release">not installed</span>
        <span class="chip warn" id="chip-update" hidden></span>
        <span class="chip" id="chip-state" data-state="stopped">Stopped</span>
      </div>
      <div class="bar-right">
        <button class="btn primary" id="btn-update" type="button" hidden>Update</button>
        <a class="btn" id="btn-open" href="#" target="_blank" rel="noopener noreferrer" hidden title="Open DeepTutor in its own browser tab">Open in new tab</a>
        <div class="menu-wrap">
          <button class="btn icon" id="btn-settings" type="button" title="Updates &amp; service" aria-label="Updates and service" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="2" fill="var(--surface)"/><circle cx="15" cy="12" r="2" fill="var(--surface)"/><circle cx="8" cy="18" r="2" fill="var(--surface)"/></svg>
          </button>
          <div class="menu" id="menu" role="menu" hidden>
            <label class="menu-row check" title="Install newer upstream releases automatically when this page opens">
              <input type="checkbox" id="chk-auto" /> <span>Auto-update</span>
            </label>
            <button class="menu-item" id="btn-check" type="button">Check for updates</button>
            <button class="menu-item" id="btn-restart" type="button">Restart service</button>
            <button class="menu-item" id="btn-stop" type="button">Stop service</button>
            <a class="menu-item" href="https://github.com/HKUDS/DeepTutor" target="_blank" rel="noopener noreferrer"
               title="DeepTutor is open source under Apache-2.0. Opens the upstream source.">Upstream source (Apache-2.0)</a>
          </div>
        </div>
      </div>
    </header>

    <main class="dt-stage">
      <iframe id="app-frame" title="DeepTutor" hidden allow="clipboard-read; clipboard-write; fullscreen; microphone"></iframe>

      <section class="installer" id="installer" hidden>
        <div class="card installer-card">
          <h2 id="inst-title">Setting up DeepTutor</h2>
          <p class="muted" id="inst-msg">Preparing…</p>
          <div class="bar-track" id="inst-track"><div class="bar-fill"></div></div>
          <pre class="log" id="inst-log"></pre>
          <div class="inst-actions">
            <button class="btn primary" id="btn-retry" type="button" hidden>Retry</button>
            <button class="btn primary" id="btn-start" type="button" hidden>Start DeepTutor</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="wrapper.js"></script>
</body>
</html>
