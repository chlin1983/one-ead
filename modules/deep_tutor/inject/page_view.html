<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Source page</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: #e5e7eb; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #1f2124; color: #eee; } header { background: #2a2c30; border-color: #3a3d42; } button, input { background: #1f2124; color: #eee; border-color: #3a3d42; } }
  header { flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; background: #fff; border-bottom: 1px solid #d1d5db; }
  header .name { flex: 1 1 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  button, input { font: inherit; padding: 3px 8px; border: 1px solid #c4c7cc; border-radius: 6px; background: #fff; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.on { border-color: #3b82f6; color: #3b82f6; }
  input { width: 3.5em; text-align: center; }
  .sp { flex: 1; }
  a { color: #3b82f6; text-decoration: none; }
  a:hover { text-decoration: underline; }
  main { flex: 1; overflow: auto; padding: 8px; text-align: center; }
  .slot { position: relative; margin: 0 auto 10px; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.25); aspect-ratio: var(--ar, 0.707); }
  .slot img { display: block; width: 100%; height: 100%; }
  .slot.failed::after { content: 'This page could not be shown.'; position: absolute; inset: 0; display: grid; place-items: center; color: #6b7280; }
  body.fit-width .slot { width: 100%; }
  body.fit-page .slot { width: min(100%, calc((100vh - 96px) * var(--ar, 0.707))); }
  body.actual .slot { width: 800px; }
  body.actual .slot.loaded { width: max-content; aspect-ratio: auto; }
  body.actual .slot img { width: auto; height: auto; max-width: none; }
  #msg { padding: 24px; color: #6b7280; }
</style>
</head>
<body class="fit-width">
<header>
  <div class="name" id="name"></div>
  <button id="prev" type="button" title="Previous page (Left arrow)">&#9664;</button>
  <input id="page" type="number" min="1" value="1" aria-label="Page">
  <span id="total"></span>
  <button id="next" type="button" title="Next page (Right arrow)">&#9654;</button>
  <span class="sp"></span>
  <button id="m-width" type="button" class="on">Fit width</button>
  <button id="m-page" type="button">Fit page</button>
  <button id="m-actual" type="button">Large</button>
  <a id="orig" target="_blank" rel="noopener">Open PDF</a>
</header>
<main id="view"><div id="msg">Loading&hellip;</div></main>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const kb = q.get('kb') || '';
  const src = q.get('src') || '';
  let page = Math.max(1, parseInt(q.get('page'), 10) || 1);
  let total = 0;
  const $ = (id) => document.getElementById(id);
  const enc = encodeURIComponent;
  const base = `/api/knowledge-bases/${enc(kb)}`;
  const imgUrl = (p) => `${base}/source-page?source_path=${enc(src)}&page=${p}`;

  $('name').textContent = src.split('/').pop() || 'Document';
  $('name').title = src;
  $('orig').href = `${base}/files/${src.split('/').map(enc).join('/')}`;

  const view = $('view');
  const slots = []; // slots[i] is page i + 1
  let ticking = false;

  // Pages load only when they come near the viewport.
  const loader = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) { loader.unobserve(e.target); load(e.target); }
  }, { root: view, rootMargin: '1500px 0px' });

  function load(slot) {
    const img = new Image();
    img.alt = `Page ${slot.dataset.page}`;
    img.addEventListener('load', () => {
      slot.style.setProperty('--ar', String(img.naturalWidth / img.naturalHeight));
      view.style.setProperty('--ar', String(img.naturalWidth / img.naturalHeight));
      slot.classList.add('loaded');
      // Page count unknown: keep adding pages until one fails.
      if (!total && slot === slots[slots.length - 1]) addSlot();
    });
    img.addEventListener('error', () => {
      slot.classList.add('failed');
      if (!total && slot === slots[slots.length - 1]) slot.remove(), slots.pop();
    });
    img.src = imgUrl(Number(slot.dataset.page));
    slot.append(img);
  }

  function addSlot() {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.page = String(slots.length + 1);
    slots.push(slot);
    view.append(slot);
    loader.observe(slot);
  }

  function sync() {
    $('page').value = String(page);
    $('prev').disabled = page <= 1;
    $('next').disabled = total > 0 && page >= total;
    $('total').textContent = total ? `/ ${total}` : '';
    const u = new URL(location.href);
    u.searchParams.set('page', String(page));
    history.replaceState(null, '', u);
  }

  function goTo(p) {
    page = Math.max(1, total ? Math.min(total, p) : p);
    while (slots.length < page) addSlot();
    slots[page - 1].scrollIntoView({ block: 'start' });
    sync();
  }

  // The current page is the one under a line 30% down the viewport.
  function trackPage() {
    ticking = false;
    const r = view.getBoundingClientRect();
    const line = r.top + r.height * 0.3;
    let cur = 1;
    for (const s of slots) {
      if (s.getBoundingClientRect().top <= line) cur = Number(s.dataset.page);
      else break;
    }
    if (cur !== page) { page = cur; sync(); }
  }
  view.addEventListener('scroll', () => {
    if (!ticking) { ticking = true; requestAnimationFrame(trackPage); }
  }, { passive: true });

  async function countPages() {
    try {
      const res = await fetch(imgUrl(1000000), { credentials: 'same-origin' });
      const body = await res.json();
      const m = /between 1 and (\d+)/.exec(String(body.detail || ''));
      if (m) return Number(m[1]);
    } catch (err) { /* page count stays unknown */ }
    return 0;
  }

  const modes = { 'm-width': 'fit-width', 'm-page': 'fit-page', 'm-actual': 'actual' };
  for (const id of Object.keys(modes)) {
    $(id).addEventListener('click', () => {
      document.body.className = modes[id];
      for (const other of Object.keys(modes)) $(other).classList.toggle('on', other === id);
      if (slots.length) slots[page - 1].scrollIntoView({ block: 'start' });
    });
  }
  $('prev').addEventListener('click', () => goTo(page - 1));
  $('next').addEventListener('click', () => goTo(page + 1));
  $('page').addEventListener('change', () => goTo(parseInt($('page').value, 10) || 1));
  document.addEventListener('keydown', (e) => {
    if (e.target === $('page')) return;
    if (e.key === 'ArrowLeft') goTo(page - 1);
    else if (e.key === 'ArrowRight') goTo(page + 1);
  });

  if (!kb || !src) {
    $('msg').textContent = 'No document selected.';
    return;
  }
  (async () => {
    total = await countPages();
    $('msg').remove();
    if (total) {
      page = Math.min(page, total);
      for (let i = 0; i < total; i++) addSlot();
    } else {
      addSlot();
    }
    goTo(page);
  })();
})();
</script>
</body>
</html>
