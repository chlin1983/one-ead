<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Arranger — Offline Page Editor</title>
  <link rel="stylesheet" href="/shared/module.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="pdfarranger-root">


    <!-- Main Workspace Stage -->
    <main class="workspace-stage">
      <!-- Installation Prompt View (if not installed) -->
      <section id="view-setup" class="setup-view" hidden>
        <div class="setup-card">
          <div class="setup-icon-wrap">
            <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="9" rx="1"/>
              <rect x="14" y="3" width="7" height="9" rx="1"/>
              <rect x="3" y="15" width="7" height="6" rx="1"/>
              <path d="M14 18h7M18 15l3 3-3 3"/>
            </svg>
          </div>
          <h2>Set up PDF Arranger</h2>
          <p class="setup-desc">
            PDF Arranger runs locally on your machine via a fast Broadway display stream.
            A one-time portable download (~60 MB) is required for offline use.
          </p>

          <div id="setup-progress-wrap" class="progress-wrap" hidden>
            <div class="progress-bar-bg">
              <div id="progress-bar" class="progress-bar-fill" style="width: 0%"></div>
            </div>
            <div id="setup-msg" class="progress-label">Downloading...</div>
          </div>

          <div id="setup-error" class="setup-error" hidden></div>

          <button id="btn-start-install" class="btn primary btn-lg" type="button">
            Download &amp; Install Now &rarr;
          </button>
        </div>
      </section>

      <!-- Active Running Stage -->
      <section id="view-running" class="running-view">
        <iframe id="tool-frame" title="PDF Arranger Canvas" allow="clipboard-read; clipboard-write"></iframe>
        <div id="tool-overlay" class="tool-overlay">
          <div id="tool-spinner" class="spinner"></div>
          <div id="tool-overlay-text">Starting PDF Arranger&hellip;</div>
          <button class="btn primary" id="btn-reopen" type="button" hidden>Reopen PDF Arranger</button>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
