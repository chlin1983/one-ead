    <style>

        inset: 0 1.5px;
        background: transparent;
        transition: background 0.15s;
      }
      .dashboard-sidebar-resizer:hover::after,
      .dashboard-sidebar-resizer:focus-visible::after,
      .dashboard-sidebar-resizer.is-dragging::after {
        background: #a855f7;
      }
      @media (max-width: 767px) {

  <script type="importmap">

  "imports": {

  <body>
    <div id="root"></div>
    <script>
      (() => {
        const minWidth = 208;
        const maxWidth = 420;

        function installSidebarResizer() {
          const sidebar = document.querySelector("#root aside:not([data-resizable-sidebar])");
          if (!sidebar || !sidebar.parentElement) return;

          const parent = sidebar.parentElement;
          const resizer = document.createElement("div");
          resizer.className = "dashboard-sidebar-resizer";
          resizer.setAttribute("role", "separator");
          resizer.setAttribute("aria-orientation", "vertical");
          resizer.setAttribute("aria-label", "Resize dashboard sidebar");
          resizer.tabIndex = 0;
          sidebar.dataset.resizableSidebar = "true";
          parent.insertBefore(resizer, sidebar.nextSibling);

          const setWidth = (width) => {
            const boundedWidth = Math.max(minWidth, Math.min(maxWidth, width));
            sidebar.style.width = `${boundedWidth}px`;
            sidebar.style.flex = `0 0 ${boundedWidth}px`;
            resizer.setAttribute("aria-valuenow", String(boundedWidth));
          };
          setWidth(320);

          resizer.addEventListener("pointerdown", (event) => {
            if (event.button !== 0) return;
            event.preventDefault();
            const startX = event.clientX;
            const startWidth = sidebar.getBoundingClientRect().width;
            resizer.classList.add("is-dragging");
            document.body.style.cursor = "col-resize";
            document.body.style.userSelect = "none";
            resizer.setPointerCapture(event.pointerId);

            const onMove = (moveEvent) => setWidth(startWidth + moveEvent.clientX - startX);
            const onEnd = () => {
              resizer.classList.remove("is-dragging");
              document.body.style.cursor = "";
              document.body.style.userSelect = "";
              resizer.removeEventListener("pointermove", onMove);
              resizer.removeEventListener("pointerup", onEnd);
              resizer.removeEventListener("pointercancel", onEnd);
            };

            resizer.addEventListener("pointermove", onMove);
            resizer.addEventListener("pointerup", onEnd);
            resizer.addEventListener("pointercancel", onEnd);
          });

          resizer.addEventListener("keydown", (event) => {
            if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
            event.preventDefault();
            const direction = event.key === "ArrowRight" ? 16 : -16;
            setWidth(sidebar.getBoundingClientRect().width + direction);
          });
        }

        const observer = new MutationObserver(installSidebarResizer);
        observer.observe(document.getElementById("root"), { childList: true, subtree: true });
        installSidebarResizer();
      })();
    </script>
